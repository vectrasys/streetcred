name = "city-proof"
main = "src/worker.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Статика сайта; запросы к /api обрабатывает Worker.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

# Деплой наружу — только с отдельного разрешения пользователя.

# Один экземпляр axios для всего бандла (PayPal Agent Toolkit его использует).
[alias]
"axios" = "./src/axios-worker.js"

# Модели на Cloudflare Workers AI — включаются только явно: `wrangler dev --env cloud`
# (запросы идут в аккаунт Cloudflare: бесплатно 10 000 нейронов в день).
# Агент: @cf/zai-org/glm-4.7-flash, проверка кадров: llama-4-scout (оба доступны на Free).
[env.cloud]
name = "city-proof"
[env.cloud.vars]
# Замер на 8 кадрах проекта: llama-4-scout 7/8 (~1 с), llava-1.5-7b 2/8 (всегда «чисто»).
WORKERS_AI_VISION_MODEL = "@cf/meta/llama-4-scout-17b-16e-instruct"
[env.cloud.ai]
binding = "AI"
# Один экземпляр города для всех запросов /api/* (SQLite-вариант есть на бесплатном тарифе).
[[env.cloud.durable_objects.bindings]]
name = "CITY"
class_name = "City"
[[env.cloud.migrations]]
tag = "v1"
new_sqlite_classes = ["City"]
[env.cloud.assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]
